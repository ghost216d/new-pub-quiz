<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2E" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="beerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="0" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F59E0B" stroke-width="8" stroke-dasharray="16 12" opacity="0.3"/>

  <!-- Beer Glass Handle -->
  <path d="M 330 200 C 400 200, 420 320, 330 350" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="round" filter="url(#shadow)"/>
  <path d="M 330 200 C 400 200, 420 320, 330 350" fill="none" stroke="#E2E8F0" stroke-width="16" stroke-linecap="round"/>

  <!-- Beer Tankard Body -->
  <rect x="150" y="180" width="180" height="200" rx="28" fill="url(#beerGrad)" stroke="#000000" stroke-width="14" filter="url(#shadow)"/>
  
  <!-- Beer bubbles / highlights -->
  <path d="M 175 220 L 175 350" stroke="#FEF3C7" stroke-width="12" stroke-linecap="round" opacity="0.6"/>
  <circle cx="210" cy="270" r="10" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="280" cy="300" r="8" fill="#FEF3C7" opacity="0.7"/>
  <circle cx="230" cy="325" r="7" fill="#FEF3C7" opacity="0.7"/>

  <!-- Frothy Foam Hat -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="180" r="32" fill="#FFFFFF" stroke="#000000" stroke-width="12"/>
    <circle cx="200" cy="160" r="38" fill="#FFFFFF" stroke="#000000" stroke-width="12"/>
    <circle cx="260" cy="155" r="42" fill="#FFFFFF" stroke="#000000" stroke-width="12"/>
    <circle cx="320" cy="175" r="34" fill="#FFFFFF" stroke="#000000" stroke-width="12"/>
    <rect x="150" y="165" width="170" height="35" fill="#FFFFFF"/>
  </g>

  <!-- Big Geeky Cartoon Glasses -->
  <g filter="url(#shadow)">
    <!-- Bridge -->
    <path d="M 220 240 Q 240 230 260 240" fill="none" stroke="#000000" stroke-width="12"/>
    <!-- Left lens -->
    <rect x="160" y="220" width="60" height="50" rx="14" fill="#38BDF8" stroke="#000000" stroke-width="12"/>
    <circle cx="178" cy="235" r="5" fill="#FFFFFF"/>
    <!-- Right lens -->
    <rect x="260" y="220" width="60" height="50" rx="14" fill="#38BDF8" stroke="#000000" stroke-width="12"/>
    <circle cx="278" cy="235" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Big Cheeky Cartoon Smile -->
  <path d="M 200 310 Q 240 345 280 310" fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round"/>

  <!-- Quiz & Music badges floating -->
  <!-- Music Note Badge -->
  <g transform="translate(90, 110) rotate(-15)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="30" fill="#EC4899" stroke="#000000" stroke-width="8"/>
    <!-- Music note -->
    <path d="M 24 38 A 6 5 0 1 1 18 33 L 18 16 L 38 12 L 38 28 A 6 5 0 1 1 32 23 L 32 18 L 24 20 Z" fill="#FFFFFF"/>
  </g>

  <!-- Quiz Question Mark Badge -->
  <g transform="translate(360, 100) rotate(15)" filter="url(#shadow)">
    <circle cx="30" cy="30" r="30" fill="#10B981" stroke="#000000" stroke-width="8"/>
    <text x="30" y="42" font-family="Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">?</text>
  </g>

  <!-- TV Screen Badge bottom right -->
  <g transform="translate(360, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="60" height="46" rx="8" fill="#6366F1" stroke="#000000" stroke-width="8"/>
    <rect x="8" y="8" width="44" height="30" rx="4" fill="#EEF2FF"/>
    <polygon points="26,17 38,23 26,29" fill="#6366F1"/>
    <line x1="30" y1="46" x2="30" y2="56" stroke="#000000" stroke-width="8"/>
    <line x1="20" y1="56" x2="40" y2="56" stroke="#000000" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
